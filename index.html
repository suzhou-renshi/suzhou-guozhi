<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#f3f5f9; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;

    --blue:#0e7490; --blue-soft:#e0f2f6;
    --red:#dc2626; --red-soft:#fdecec;
    --slate:#475569; --radius:14px;

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1f2937; padding-bottom:env(safe-area-inset-bottom);}
  .header{position:sticky; top:0; z-index:50; background:linear-gradient(135deg,#0e7490 0%,#155e75 45%,#0f3d4e 100%); color:#fff; padding:16px 16px 18px; padding-top:calc(16px + env(safe-area-inset-top)); border-radius:0 0 22px 22px; box-shadow:0 6px 18px rgba(15,61,78,.28);}
  .header .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .header h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.5px;}
  .header .sub{font-size:12px; opacity:.85; margin-top:3px;}
  .header .src{font-size:11px; opacity:.8; text-align:right; line-height:1.4;}
  .statchips{display:flex; gap:8px; margin-top:14px;}
  .stat{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:8px 10px; flex:1; text-align:center;}
  .stat .num{font-size:18px; font-weight:700; line-height:1.1;}
  .stat .lab{font-size:11px; opacity:.85; margin-top:2px;}

  .toolbar{position:sticky; top:0; z-index:40; background:var(--bg); padding:12px 16px 4px;}
  .searchbar{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 12px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .searchbar input{border:none; outline:none; flex:1; font-size:14px; background:transparent;}
  .searchbar .icon{color:var(--muted); font-size:16px;}
  .filters{display:flex; gap:8px; overflow-x:auto; padding:10px 0 8px; -webkit-overflow-scrolling:touch;}
  .filters::-webkit-scrollbar{display:none;}
  .fchip{flex:none; background:#fff; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap;}
  .fchip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .fchip .cnt{opacity:.7; margin-left:3px; font-size:11px;}

  .wrap{padding:10px 16px 24px;}
  .group{margin-bottom:18px;}
  .ghead{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .ghead .dot{width:10px;height:10px;border-radius:50%; flex:none;}
  .ghead .gname{font-size:15px; font-weight:700;}
  .ghead .gmeta{font-size:11px; color:var(--muted); margin-left:auto;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .pname{font-size:14px; font-weight:600; line-height:1.45;}
  .card .pname .amt{color:var(--accent); font-weight:700; margin-left:4px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px;}
  .tag.signed{background:var(--green-soft); color:var(--green);}
  .tag.opp{background:var(--blue-soft); color:var(--blue);}
  .tag.void{background:#f1f5f9; color:#94a3b8; text-decoration:line-through;}
  .tag.key{background:#fff7ed; color:#ea580c; border:1px solid #fed7aa;}
  .meta{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:12px; color:var(--muted);}
  .meta .k{color:#9aa1ab;}
  .meta b{color:var(--ink); font-weight:600;}
  .notebox{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:#475569; line-height:1.65;}
  .empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:13px;}
  footer{text-align:center; color:#9aa1ab; font-size:11px; padding:6px 16px 20px;}
  .footer-tip{margin-top:8px; background:#fff; border:1px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:11px; color:var(--muted); line-height:1.7; text-align:left;}
</style>

const STATUS = {
  signed:{label:"签约", cls:"signed"},
  opp:   {label:"商机", cls:"opp"},
  void:  {label:"作废", cls:"void"}
};

function fmtDate(){const d=new Date();return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function render(data){
  const el=document.getElementById("list");
  if(!data.length){el.innerHTML='<div class="empty">未找到匹配的项目</div>';return;}
  let html="", cCli=0, cProj=0, sum=0;
  data.forEach(g=>{
    if(!g.projects.length)return;
    cCli++; cProj+=g.projects.length;
    g.projects.forEach(p=>{const m=String(p.amt||"").match(/[\d.]+/); if(m)sum+=parseFloat(m[0]);});
    html+='<div class="group"><div class="ghead"><span class="dot" style="background:'+g.c+'"></span><span class="gname">'+esc(g.group)+'</span><span class="gmeta">'+g.projects.length+' 项</span></div>';
    g.projects.forEach(p=>{
      html+='<div class="card"><div class="pname">'+esc(p.t||"")+'<span class="amt">'+esc(p.amt||"")+'</span></div>';
      html+='<div class="tags">';
      if(p.st&&STATUS[p.st])html+='<span class="tag '+STATUS[p.st].cls+'">'+STATUS[p.st].label+'</span>';
      if(p.key)html+='<span class="tag key">近期重点</span>';
      html+='</div>';
      html+='<div class="meta">';
      if(p.time)html+='<span><span class="k">时间</span> <b>'+esc(p.time)+'</b></span>';
      if(p.income)html+='<span><span class="k">入收/回款</span> <b>'+esc(p.income)+'</b></span>';
      html+='</div>';
      if(p.note)html+='<div class="notebox">'+esc(p.note)+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  if(!cCli){el.innerHTML='<div class="empty">未找到匹配的项目</div>';return;}
  el.innerHTML=html;
  document.getElementById("stClient").textContent=cCli;
  document.getElementById("stProj").textContent=cProj;
  document.getElementById("stAmt").textContent=Math.round(sum)+"万";
}

let cur="all", kw="", M=DATA;

function buildFilters(){
  const f=document.getElementById("filters");
  const all=[{k:"all",label:"全部"}];
  Object.keys(STATUS).forEach(k=>{ if(M.some(g=>g.projects.some(p=>p.st===k)))all.push({k,label:STATUS[k].label}); });
  all.forEach(o=>{
    const n=o.k==="all"?M.reduce((s,g)=>s+g.projects.length,0):M.reduce((s,g)=>s+g.projects.filter(p=>p.st===o.k).length,0);
    const el=document.createElement("div");
    el.className="fchip"+(cur===o.k?" on":"");
    el.innerHTML=o.label+' <span class="cnt">'+n+'</span>';
    el.onclick=()=>{ cur=o.k; document.querySelectorAll(".fchip").forEach(x=>x.classList.remove("on")); el.classList.add("on"); doRender(); };
    f.appendChild(el);
  });
}

  const q=kw.trim();
  let d=M;
  if(q){const Q=q.toLowerCase(); d=d.map(g=>{const hitG=(g.group||"").toLowerCase().includes(Q); return {...g,projects:g.projects.filter(p=>hitG||((p.t||"")+(p.amt||"")+(p.note||"")+(p.time||"")+(p.income||"")).toLowerCase().includes(Q))};}).filter(g=>g.projects.length);}
  if(cur!=="all"){d=d.map(g=>({...g,projects:g.projects.filter(p=>p.st===cur)})).filter(g=>g.projects.length);}
  render(d);
}

document.getElementById("q").addEventListener("input",e=>{kw=e.target.value; doRender();});
document.getElementById("today").textContent="更新日期 "+fmtDate();
buildFilters();
doRender();
</script>
